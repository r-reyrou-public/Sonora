[package]
name = "sonora"
version = "0.97.0"
license = "Apache-2.0"
authors = ["鈴屋玲瓏"]
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Native file dialog & user directories
rfd = "0.15"
dirs = "5.0"

# Audio decoding & playback (WASAPI native)
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }

# Metadata & Tags (ID3v2, FLAC, MP4, APIC embedded pictures)
lofty = "0.21"

# Database & Settings

# Utilities & Concurrency
crossbeam-channel = "0.5"
rayon = "1.10"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_Security",
    "Win32_System_ProcessStatus",
    "Win32_Networking_WinHttp",
] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1"
